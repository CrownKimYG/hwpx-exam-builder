<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="국어·수학 문제은행으로 시험지를 만드는 시험지 제작실" />
    <meta name="hwpx-exam-builder-version" content="subject-handoff-v1" />
    <title>시험지 제작실</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="hero-title">
          <h1><button class="app-home" id="app-home" type="button">시험지 제작실</button></h1>
          <span class="bank-title-separator hidden" id="bank-title-separator">&gt;</span>
          <div class="bank-profile-summary hidden" id="bank-profile-summary">
            <button id="active-bank-name" type="button" aria-label="문제은행 이름 변경"></button>
          </div>
        </div>
        <div class="hero-bank-tools" id="hero-bank-tools"></div>
      </header>

      <section class="upload-card" id="upload-card">
        <div class="file-drop" id="bank-drop">
          <strong>새로운 문제은행 추가</strong>
          <div class="upload-actions" id="upload-actions">
            <label class="button folder-select-button" for="folder-input">폴더 선택</label>
            <label class="button" for="files-input">HWP/HWPX 파일 추가</label>
            <label class="button" for="handoff-input">이어 만들기</label>
          </div>
          <input id="folder-input" type="file" accept=".hwp,.hwpx" webkitdirectory directory multiple />
          <input id="files-input" type="file" accept=".hwp,.hwpx,application/x-hwp,application/zip" multiple />
          <input id="handoff-input" type="file" accept=".hwpx,.zip,application/zip" multiple />
        </div>
        <p class="status" id="status" aria-live="polite"></p>
      </section>

      <section class="bank-home" id="bank-home" aria-labelledby="bank-home-title">
        <h2 id="bank-home-title">문제은행 목록</h2>
        <div class="bank-home-table-wrap">
          <table class="bank-home-table">
            <thead><tr><th>이름</th><th>처리 방식</th><th>파일</th><th>문항</th><th>단원</th><th>미분류</th><th></th></tr></thead>
            <tbody id="bank-home-rows"></tbody>
          </table>
        </div>
        <p class="saved-bank-empty hidden" id="bank-home-empty">저장된 문제은행이 없습니다.</p>
      </section>

      <section class="workspace hidden" id="workspace">
        <div class="metrics" aria-label="문제은행 정보">
          <span>파일 <strong id="metric-files">0</strong></span>
          <span>문항 <strong id="metric-total">0</strong></span>
          <span>단원 <strong id="metric-units">0</strong></span>
          <span>미분류 <strong id="metric-unclassified">0</strong></span>
        </div>

        <button class="bank-attention hidden" id="bank-attention" type="button">
          <span id="bank-attention-text"></span>
          <strong>확인</strong>
        </button>

        <details class="bank-manager" id="bank-manager">
          <summary>문제은행 정보 수정</summary>
          <div class="bank-table-wrap">
            <table class="bank-table">
              <thead><tr><th>코드</th><th>파일</th><th>처리 방식</th><th>과목</th><th>단원</th><th>난이도별 문항</th><th>상태</th><th></th></tr></thead>
              <tbody id="bank-file-rows"></tbody>
            </table>
          </div>
          <div class="question-metadata" id="question-metadata"></div>
        </details>

        <div class="app-grid">
          <section class="viewer-card" aria-labelledby="viewer-title">
            <header class="viewer-toolbar">
              <div class="viewer-file-control">
                <select id="preview-file" aria-label="미리보기 파일 선택"></select>
              </div>
            </header>
            <h2 class="sr-only" id="viewer-title">원본 페이지 미리보기</h2>
            <div class="page-stage" id="page-stage">
              <div class="preview-console">
                <nav class="page-controls" aria-label="페이지 이동">
                  <button id="previous-page" type="button" aria-label="이전 페이지">‹</button>
                  <span id="page-label" aria-live="polite">0 / 0</span>
                  <button id="next-page" type="button" aria-label="다음 페이지">›</button>
                </nav>
                <span class="preview-console-divider" aria-hidden="true"></span>
                <div class="zoom-controls" aria-label="미리보기 확대 축소">
                  <button id="zoom-out" type="button" aria-label="축소">−</button>
                  <button id="zoom-fit" type="button"><span id="zoom-label">맞춤</span></button>
                  <button id="zoom-in" type="button" aria-label="확대">＋</button>
                </div>
              </div>
              <div class="page-loading" id="page-loading"></div>
              <div class="page-canvas hidden" id="page-canvas"></div>
            </div>
          </section>

          <aside class="builder-panel" aria-labelledby="builder-title">
            <section class="quick-card">
              <div class="section-heading">
                <h2 id="builder-title">빠른 출제</h2>
                <button id="toggle-quick" type="button" aria-expanded="true">접기</button>
              </div>
              <div id="quick-body">
                <div class="quick-settings">
                  <label><span id="quick-question-count-label">시험지당 문항 수</span><input id="quick-question-count" type="number" min="1" max="100" value="8" /></label>
                  <label>생성할 시험지 수<input id="quick-exam-count" type="number" min="1" value="1" /></label>
                  <label>랜덤 시드<input id="quick-seed" type="text" /></label>
                </div>
                <div class="matrix-wrap" id="matrix-wrap"></div>
                <p class="quick-status" id="quick-status"></p>
                <button class="primary wide" id="quick-generate" type="button" disabled>빠른 출제 결과 추가</button>
              </div>
            </section>

            <section class="exam-list-card">
              <div class="section-heading">
                <h2>시험지 출제 목록</h2>
                <div class="inline-actions">
                  <button id="add-exam" type="button">＋ 시험지</button>
                  <button id="clear-exams" type="button">전체 비우기</button>
                </div>
              </div>
              <div class="exam-list" id="exam-list"></div>
            </section>
          </aside>
        </div>
      </section>
    </main>

    <dialog class="bank-dialog" id="bank-profile-dialog">
      <form id="bank-profile-form" method="dialog">
        <h2 id="bank-profile-dialog-title">문제은행 저장</h2>
        <p class="dialog-summary" id="bank-profile-summary-text"></p>
        <label>문제은행 이름
          <input id="bank-profile-name" type="text" maxlength="80" required />
        </label>
        <label>처리 방식
          <select id="bank-profile-rule">
            <option value="macro-endnote-v1">[수학]수특변형Z</option>
            <option value="ebsi-korean-v1">[국어]EBS연계</option>
          </select>
        </label>
        <p class="dialog-error" id="bank-profile-error" aria-live="polite"></p>
        <div class="dialog-actions">
          <button id="cancel-bank-profile" type="button">취소</button>
          <button class="primary" value="confirm" type="submit">저장</button>
        </div>
      </form>
    </dialog>

    <dialog class="bank-dialog build-warning-dialog" id="build-warning-dialog">
      <form method="dialog">
        <h2>누락 항목 확인</h2>
        <p class="dialog-summary">선택한 국어 문항에 정답 또는 해설 누락이 있습니다.</p>
        <div class="build-warning-list" id="build-warning-list"></div>
        <div class="dialog-actions">
          <button value="cancel" type="submit">취소</button>
          <button class="primary" value="confirm" type="submit">계속 생성</button>
        </div>
      </form>
    </dialog>

    <footer class="generation-bar hidden" id="generation-bar">
      <div class="generation-inner">
        <div class="template-control">
          <label class="button" for="template-file">템플릿 선택</label>
          <input id="template-file" type="file" accept=".hwpx,application/zip" />
          <span id="template-file-name">기본 템플릿</span>
        </div>
        <label>출력 종류
          <select id="output-type">
            <option value="problem">문제지</option>
            <option value="solution">문제지(해설 포함)</option>
            <option value="both">문제지, 해설지 따로</option>
          </select>
        </label>
        <label>문항 형식
          <select id="question-format">
            <option value="original">원본</option>
            <option value="short">주관식</option>
            <option value="essay">서술형</option>
          </select>
        </label>
        <label class="check-control"><input id="show-subject-title" type="checkbox" />과목 제목</label>
        <label class="button" for="handoff-input">인계 파일 불러오기</label>
        <button id="save-handoff" type="button" disabled>인계용 HWPX 저장</button>
        <button class="primary generate" id="build-exams" type="button" disabled>최종 시험지 생성</button>
      </div>
      <details class="template-fields hidden" id="template-fields">
        <summary>템플릿 누름틀 공통값</summary>
        <div class="field-grid" id="field-grid"></div>
      </details>
      <div class="build-feedback">
        <p class="build-status" id="build-status" aria-live="polite"></p>
        <button class="cancel-build hidden" id="cancel-build" type="button">취소</button>
      </div>
    </footer>

    <script>
      (() => {
        const status = document.querySelector("#status");
        if (window.location.protocol === "file:") {
          status.className = "status error";
          status.textContent = "HTML 파일을 직접 열면 RHWP 렌더러를 실행할 수 없습니다. ";
          const link = document.createElement("a");
          link.href = "https://crownkimyg.github.io/hwpx-exam-builder/";
          link.textContent = "배포 페이지에서 열기";
          status.append(link);
          return;
        }
        window.setTimeout(() => { if (!status.dataset.rendererState) status.dataset.rendererState = "slow"; }, 20000);
      })();
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
