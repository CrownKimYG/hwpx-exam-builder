<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HWPX 문제은행을 브라우저에서 분석하고 원본 페이지로 미리 봅니다." />
    <title>HWPX Exam Builder</title>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">HWPX QUESTION PREVIEW</p>
          <h1>HWPX Exam Builder</h1>
          <p class="subtitle">문제은행을 분석하고 한글 문서의 원본 페이지 형태로 확인합니다.</p>
        </div>
        <span class="privacy-badge">파일 외부 전송 없음</span>
      </header>

      <section class="upload-card" id="upload-card">
        <label class="file-drop" for="hwpx-file">
          <span class="file-icon">HWPX</span>
          <strong>첫 번째 샘플 형식의 HWPX를 선택하세요</strong>
          <span>파일은 이 브라우저의 메모리에서만 처리됩니다.</span>
          <input id="hwpx-file" type="file" accept=".hwpx,application/zip" />
        </label>
        <p class="status" id="status" aria-live="polite">렌더러를 준비하는 중입니다...</p>
      </section>

      <section class="workspace hidden" id="workspace">
        <div class="metrics">
          <article><span>인식 문항</span><strong id="metric-total">0</strong></article>
          <article><span>5지선다형</span><strong id="metric-multiple">0</strong></article>
          <article><span>단답식</span><strong id="metric-short">0</strong></article>
          <article><span>문서 페이지</span><strong id="metric-pages">0</strong></article>
        </div>

        <section class="viewer-card" aria-labelledby="viewer-title">
          <header class="viewer-toolbar">
            <div>
              <p class="eyebrow">RHWP PAGE RENDERER</p>
              <h2 id="viewer-title">원본 페이지 미리보기</h2>
            </div>
            <nav class="page-controls" aria-label="페이지 이동">
              <button id="previous-page" type="button" aria-label="이전 페이지">이전</button>
              <span id="page-label" aria-live="polite">1 / 1</span>
              <button id="next-page" type="button" aria-label="다음 페이지">다음</button>
            </nav>
          </header>
          <div class="page-stage" id="page-stage">
            <div class="page-loading" id="page-loading">페이지를 렌더링하는 중입니다...</div>
            <div class="page-canvas" id="page-canvas"></div>
          </div>
          <p class="viewer-note">미리보기에는 XML 코드가 표시되지 않습니다. 페이지는 브라우저에서 직접 생성됩니다.</p>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
