name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app question_bank

  pages-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
      - run: pnpm build

  live-pages-check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the deployed template-slots build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            html="$(curl -fsSL --max-time 15 https://crownkimyg.github.io/hwpx-exam-builder/ || true)"
            if grep -q 'hwpx-exam-builder-version.*template-slots-v1' <<<"$html"; then
              echo "Live GitHub Pages contains template-slots-v1."
              exit 0
            fi
            echo "Live marker not visible yet (attempt ${attempt}/36)."
            sleep 5
          done
          echo "Expected deployment marker was not found on GitHub Pages." >&2
          exit 1
